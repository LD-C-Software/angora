version: '3.8'

services:
  postgres:
    image: postgres:18-alpine
    container_name: crm-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crm}
      POSTGRES_USER: ${POSTGRES_USER:-crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crm}
    volumes:
      - crm-postgres-data:/var/lib/postgresql
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    networks:
      - crm-network
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-crm} -d ${POSTGRES_DB:-crm}',
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: crm-backend
    environment:
      # postgres:5432 is the internal Docker network address — always fixed,
      # regardless of what POSTGRES_PORT maps to on the host.
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-crm}
      DB_USER: ${POSTGRES_USER:-crm}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-crm}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '${BACKEND_PORT:-8080}:8080'
    networks:
      - crm-network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8080/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: crm-frontend
    depends_on:
      - backend
    ports:
      - '${FRONTEND_PORT:-3000}:3000'
    networks:
      - crm-network

  slack-bot:
    build:
      context: .
      dockerfile: apps/bots/slack/Dockerfile
    container_name: crm-slack-bot
    depends_on:
      - backend
    networks:
      - crm-network

  discord-bot:
    build:
      context: .
      dockerfile: apps/bots/discord/Dockerfile
    container_name: crm-discord-bot
    depends_on:
      - backend
    networks:
      - crm-network

  email-bot:
    build:
      context: .
      dockerfile: apps/bots/email/Dockerfile
    container_name: crm-email-bot
    depends_on:
      - backend
    networks:
      - crm-network

volumes:
  crm-postgres-data:

networks:
  crm-network:
    driver: bridge

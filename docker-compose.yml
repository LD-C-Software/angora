version: '3.8'

services:
  postgres:
    image: postgres:18-alpine
    container_name: angora-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-angora}
      POSTGRES_USER: ${POSTGRES_USER:-angora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-angora}
    volumes:
      - angora-postgres-data:/var/lib/postgresql
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    networks:
      - angora-network
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-angora} -d ${POSTGRES_DB:-angora}',
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: angora-backend
    environment:
      # postgres:5432 is the internal Docker network address — always fixed,
      # regardless of what POSTGRES_PORT maps to on the host.
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-angora}
      DB_USER: ${POSTGRES_USER:-angora}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-angora}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '${BACKEND_PORT:-8080}:8080'
    networks:
      - angora-network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8080/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: angora-frontend
    depends_on:
      - backend
    ports:
      - '${FRONTEND_PORT:-3000}:3000'
    networks:
      - angora-network

  slack-bot:
    build:
      context: .
      dockerfile: apps/bots/slack/Dockerfile
    container_name: angora-slack-bot
    depends_on:
      - backend
    networks:
      - angora-network

  discord-bot:
    build:
      context: .
      dockerfile: apps/bots/discord/Dockerfile
    container_name: angora-discord-bot
    ports:
      - '3001:3001'
    environment:
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-YOUR_DISCORD_BOT_TOKEN}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      BACKEND_URL: http://backend:8080
    depends_on:
      - backend
    networks:
      - angora-network

  email-bot:
    build:
      context: .
      dockerfile: apps/bots/email/Dockerfile
    container_name: angora-email-bot
    depends_on:
      - backend
    networks:
      - angora-network

volumes:
  angora-postgres-data:

networks:
  angora-network:
    driver: bridge
